name: evide_school_parent
description: Evide School Transport — parent live tracking app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  mapbox_maps_flutter: ^2.23.0
  http: ^1.2.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  audioplayers: ^6.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1

# Native splash screen (logo on white). After `flutter pub get`, generate the
# native assets once with:  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash/splash_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/splash/android12_splash.png

flutter:
  uses-material-design: true
  assets:
    - assets/evide-logo.png
    - assets/alarm.mp3
    - assets/bus_top.png
    - assets/markers/
